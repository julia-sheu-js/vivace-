# Sandbox/dev nginx main config (used only by docker-compose.base44.yml).
#
# Two deliberate deviations from a production nginx setup:
#  * `user root;` — the sandbox clones the repo into a 0700 directory, which the
#    image's default unprivileged `nginx` worker user cannot traverse. Workers
#    therefore stay root so the bind-mounted working tree can be read.
#  * `Cache-Control: no-store` — the preview must reflect the file on disk right
#    after an edit instead of a cached stylesheet/script.
# Production static hosting is unaffected by either.
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
