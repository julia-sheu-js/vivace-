# Base44 sandbox / dev environment.
#
# This project is a plain static site (HTML + CSS + JS, no build step, no
# package manager), so the "app service" is just a web server serving the
# bind-mounted cloned source — edits on disk show up on the next reload, with
# no image rebuild. Nothing here is used in production.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Serve the working tree directly, so source edits are live.
      - ./:/usr/share/nginx/html:ro
      # Sandbox-only server config: no-store caching so the preview never
      # shows a stale stylesheet/script after an edit.
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "Vivace"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
